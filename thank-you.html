<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Application received | MR ARYAN STAFFLINK</title>
  <meta name="description" content="Thank you for applying to MR ARYAN STAFFLINK.">
  <style>
    :root{color-scheme:light;--navy:#0b1630;--blue:#075183;--green:#008b5a;--paper:#f3f8fb;--muted:#5f7182}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;background:var(--paper);color:var(--navy);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}
    main{width:min(100%,620px);padding:36px 28px;background:#fff;border:1px solid #dce5eb;border-radius:24px;box-shadow:0 16px 40px #14243a12;text-align:center}
    .logo{width:72px;height:72px;object-fit:contain}
    .brand{margin:10px 0 26px;font-weight:800;letter-spacing:.03em}
    .check{margin:0 auto 18px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#e5f6ee;color:var(--green);font-size:30px;font-weight:800}
    h1{margin:0 0 10px;font-size:clamp(28px,6vw,38px);line-height:1.15}
    p{margin:0 auto 24px;max-width:460px;color:var(--muted);font-size:18px}
    a{display:inline-block;padding:12px 20px;border-radius:12px;background:var(--green);color:#fff;text-decoration:none;font-weight:750}
    a:hover{background:#00734b}
  </style>
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1755159895589977');
    fbq('track','PageView');
    const formType=new URLSearchParams(window.location.search).get('form')==='employer'?'employer':'candidate';
    const leadName=formType==='employer'?'Employer Staff Request':'Candidate Job Application';
    try{
      const eventKey='stafflink_lead_sent_'+formType;
      if(!sessionStorage.getItem(eventKey)){
        sessionStorage.setItem(eventKey,'1');
        fbq('track','Lead',{content_name:leadName,content_category:'StaffLink form'});
      }
    }catch(e){fbq('track','Lead',{content_name:leadName,content_category:'StaffLink form'});}
  </script>
</head>
<body>
  <main>
    <img class="logo" src="/mr-aryan-stafflink-circle-logo.png" alt="MR ARYAN STAFFLINK logo">
    <div class="brand">MR ARYAN STAFFLINK</div>
    <div class="check" aria-hidden="true">✓</div>
    <h1>Application received</h1>
    <p>Thank you for applying. Our team will review your details and contact you about suitable job opportunities.</p>
    <a href="/">Back to website</a>
  </main>
</body>
</html>
